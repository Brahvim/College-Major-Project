<html lang="en">
<!DOCTYPE html>

<head>
	<meta charset="UTF-8">
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>
	<title>Résum󠃩é</title>
</head>

<script>
	document.addEventListener("DOMContentLoaded", () => {

		const params = new URLSearchParams(new URL(window.location.href).search);
		const btnPrint = document.getElementById("print-btn");
		const resume = document.getElementById("resume");
		const layout = params.get("l");
		const theme = params.get("t");

		document.body.innerHTML += `<link rel="stylesheet" href="${`/theme/${theme}.css`}">`;

		fetch(`/layout/${layout}.html`).then((p_response) => {

			p_response.text().then((p_html) => {

				document.body.insertAdjacentHTML("beforebegin", p_html);

				// Fetch JS ONLY when HTML exists:
				fetch(`/js/${layout}.js`).then((p_response) => {

					p_response.text().then((p_js) => {

						document.body.appendChild(document.createElement("script")).textContent = p_js;

					});

				});

			});

		});

	});
</script>

<body>
	<div id="section-manager-container">
		<button id="add-section-btn">Add Section</button>
		<button id="print-btn">Print</button>
	</div>
</body>

<style>
	@media print {

		#section-manager-container {
			display: none !important;
		}

	}

	#section-manager-container {
		columns: 2;
		display: flex;
		margin-top: 2rem;
		justify-content: center;
	}

	#section-manager-container button {
		margin-left: 2px;
	}

	#add-section-btn {
		padding: 0.5rem 1rem;
		font-size: 1rem;
		border: none;
		border-radius: 6px;
		background: #5599ff;
		color: white;
		cursor: pointer;
		transition: background 0.2s ease;
	}

	#print-btn {
		padding: 0.5rem 1rem;
		font-size: 1rem;
		border: none;
		border-radius: 6px;
		background: #5599ff;
		color: white;
		cursor: pointer;
		transition: background 0.2s ease;
	}

	.remove-section-btn {
		margin-left: 90%;
		margin-right: 5%;
		border-radius: 16px;
	}

	#print-btn:hover {
		background: #407ddf;
	}

	#add-section-btn:hover {
		background: #407ddf;
	}
</style>

</html>
