<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8" />
<meta
	name="viewport"
	content="width=device-width, initial-scale=1.0"
/>
<title>Choose Layout & Theme</title>

<style>
	body {
		margin: 0;
		color: #333;
		height: 100vh;
		background: #f4f6fa;
		font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
	}

	.choice-screen {
		gap: 2rem;
		display: flex;
		padding: 2rem;
		height: fit-content;
		box-sizing: border-box;

		@media (max-width: 768px) {
			flex-direction: column;
		}
	}

	.column {
		flex: 1;
		padding: 2rem;
		display: flex;
		background: white;
		height: fit-content;
		border-radius: 20px;
		flex-direction: column;
		box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
	}

	h2 {
		font-weight: 600;
		margin-bottom: 1.5rem;
	}

	.button-grid {
		gap: 1rem;
		display: grid;
	}

	.button-grid-layout {
		columns: 2;
	}

	.layout-btn {
		width: 80% !important;
	}

	.layout-btn,
	.theme-btn {
		all: unset;
		padding: 1rem;
		display: flex;
		cursor: pointer;
		align-items: center;
		border-radius: 16px;
		background: #e7efff;
		flex-direction: column;
		transition: background 0.2s ease;
	}

	.layout-btn:hover,
	.theme-btn:hover {
		background: #d0e4ff;
	}

	.layout-btn.selected,
	.theme-btn.selected {
		outline-offset: 3px;
		background: #dceeff;
		transform: scale(1.02);
		transition: all 0.15s ease;
		outline: 3px solid #5599ff;
		box-shadow: 0 0 0 3px rgba(85, 153, 255, 0.3);
	}

	.layout-skeleton {
		width: 100%;
		height: 80px;
		overflow: hidden;
		position: relative;
		border-radius: 12px;
		background: #cbd9ec;
		margin-bottom: 0.5rem;
	}

	.top-bottom {
		gap: 0.3rem;
		display: flex;
		padding: 0.5rem;
		background: none;
		flex-direction: column;
		justify-content: space-evenly;
	}

	.top-bottom div {
		width: 90%;
		height: 6px;
		opacity: 0.8;
		margin-left: 5%;
		border-radius: 4px;
		background: #aac4e4;
	}

	.layout-203050-fixed {
		gap: 4px;
		width: 100%;
		padding: 4px;
		height: 80px;
		display: flex;
		background: none;
		box-sizing: border-box;
		flex-direction: column;
	}

	.layout-203050-fixed .row {
		margin-left: 5%;
		display: flex;
		width: 90%;
		gap: 4px;
	}

	.layout-203050-fixed .top-row {
		height: 40%;
	}

	.layout-203050-fixed .bottom-row {
		height: 60%;
	}

	.slice {
		height: 100%;
		border-radius: 6px;
		background: #aac4e4;
	}

	.slice-20 {
		width: 30%;
		height: 100%;
		background: #aac4e4;
	}

	.slice-30 {
		width: 70%;
		background: #94b8e4;
	}

	.slice-50 {
		width: 100%;
		background: #7ca8e2;
	}

	.tiles {
		gap: 4px;
		width: 90%;
		padding: 4px;
		display: grid;
		background: none;
		grid-template-rows: repeat(3, 1fr);
		grid-template-columns: repeat(4, 1fr);
	}

	.tiles div {
		opacity: 0.9;
		border-radius: 6px;
		background: linear-gradient(145deg, #aac4e4, #94b8e4);
	}

	.card-sections {
		width: 90%;
		display: flex;
		flex-direction: column;
	}

	.card-sections .top {
		height: 30%;
		background: #aac4e4;
		border-radius: 12px 12px 0 0;
	}

	.card-sections .bottom {
		height: 70%;
		background: #94b8e4;
		border-radius: 0 0 12px 12px;
	}
</style>

<body>
	<main class="choice-screen">
		<!-- Layouts: -->
		<section class="column layout-column">
			<h2>Select Layout</h2>
			<div class="button-grid-layout">

				<section>
					<button
						class="layout-btn layout-btn-top-bottom"
						data-layout="top-bottom"
					>
						<div class="layout-skeleton top-bottom">
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
						</div>
						<span>Top-Bottom</span>
					</button>
					<button
						class="layout-btn layout-btn-20-30-50"
						data-layout="20-30-50"
					>
						<div class="layout-skeleton layout-203050-fixed">
							<div class="row top-row">
								<div class="slice slice-20"></div>
								<div class="slice slice-30"></div>
							</div>
							<div class="row bottom-row">
								<div class="slice slice-50"></div>
							</div>
						</div>
						<span>20%-30%-50%</span>
					</button>
				</section>

				<section>
					<button
						class="layout-btn layout-btn-tiles"
						data-layout="tiles"
					>
						<div class="layout-skeleton tiles">
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
							<div></div>
						</div>
						<span>Tiles</span>
					</button>

					<button
						class="layout-btn layout-btn-card-sections"
						data-layout="card-sections"
					>
						<div class="layout-skeleton card-sections">
							<div class="top"></div>
							<div class="bottom"></div>
						</div>
						<span>Card + Sections</span>
					</button>
				</section>

			</div>
		</section>

		<!-- Themes: -->
		<section class="column theme-column">
			<h2>Select Theme</h2>
			<div class="button-grid">

				<button
					data-layout="corporate-blue"
					class="theme-btn corporate-blue"
				>Corporate Blue</button>

				<button
					data-layout="frutiger-aero"
					class="theme-btn frutiger-aero"
				>Frutiger Aero</button>

				<button
					data-layout="wise-rose"
					class="theme-btn wise-rose"
				>Wise Rose</button>

				<button
					data-layout="neon-lights"
					class="theme-btn neon-lights"
				>Neon Lights</button>

				<button
					data-layout="cybersec-black"
					class="theme-btn cybersec-black"
				>Cybersec Black</button>

				<button
					data-layout="kernel-org"
					class="theme-btn kernel-org"
				>Kernel.org Theme</button>

				<button
					data-layout="github-dark"
					class="theme-btn github-dark"
				>GitHub Dark</button>

			</div>
		</section>
	</main>
</body>

<style>
	.corporate-blue {
		font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		box-shadow: 0 4px 12px rgba(0, 64, 128, 0.1);
		background-color: #7397c7;
		color: #133972;
	}

	.cybersec-black {
		font-family: "Fira Code", monospace;
		background-color: #0b0f10;
		color: #54d3c9;
	}

	.frutiger-aero {
		text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
		font-family: "Segoe UI", "Tahoma", sans-serif;
		box-shadow: 0 0 12px rgba(0, 170, 255, 0.3);
		background: rgba(0, 170, 255, 0.3);
	}

	.github-dark {
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
		box-shadow: 0px 0px 12px #238636;
		background-color: #30363d;
		color: #4493f8;
	}

	.neon-lights {
		color: #00f6ff;
		background: #110e2b;
		border: 2px solid #f0f;
		font-family: "Orbitron", "Courier New", monospace;
		box-shadow: 0 0 8px #0ff, 0 0 8px #f0f, 0 0 8px #0ff inset;
	}

	.kernel-org {
		background-color: #171717;
		border: 2px solid black;
		font-family: monospace;
		font-size: 11pt;
		color: #28d;
	}

	.wise-rose {
		background-color: #fdf3f7;
		font-family: "Georgia", serif;
		box-shadow: inset 0 0 12px rgba(170, 120, 135, 0.1);
	}
</style>

<script>
	let g_choiceTheme = sessionStorage.getItem("theme") ?? "";
	let g_choiceLayout = sessionStorage.getItem("layout") ?? "";

	document.addEventListener("DOMContentLoaded", () => {

		const btnArrayTheme = [...document.querySelectorAll(".theme-btn")];
		const btnArrayLayout = [...document.querySelectorAll(".layout-btn")];
		const createUrl = () => `/resume.html?l=${g_choiceLayout}&&t=${g_choiceTheme}`;
		const cbckAssignUrl = () => window.location.href = (g_choiceTheme && g_choiceLayout) ? createUrl() : "";

		switch (sessionStorage.getItem("last")) {

			case "theme":
				try { document.querySelector(`.theme-btn.${g_choiceTheme}`).classList.add("selected"); } catch { };
				break;


			case "layout":
				try { document.querySelector(`.layout-btn.layout-btn-${g_choiceLayout}`).classList.add("selected"); } catch { };
				break;

		}

		btnArrayLayout.forEach(p_button => {

			p_button.addEventListener("click", () => {

				btnArrayLayout.forEach(b => b.classList.remove("selected"));
				g_choiceLayout = p_button.getAttribute("data-layout");

				sessionStorage.setItem("layout", g_choiceLayout);
				sessionStorage.setItem("last", "layout");

				p_button.classList.add("selected");
				cbckAssignUrl();

			});

		});

		btnArrayTheme.forEach(p_button => {

			p_button.addEventListener("click", () => {

				btnArrayTheme.forEach(b => b.classList.remove("selected"));
				g_choiceTheme = p_button.getAttribute("data-layout");

				sessionStorage.setItem("theme", g_choiceTheme);
				sessionStorage.setItem("last", "theme");

				p_button.classList.add("selected");
				cbckAssignUrl();

			});

		});

	});
</script>

</html>
