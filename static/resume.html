	// Load the loadings!...:
	async function load() {
		// Destructuring ain't "slow", but:
		const css = document.createElement("link");
		const html = await fetch(`/layout/${g_layout}.html`);
		const javascript = await fetch(`/js/${g_layout}.js`);

		// Forcing JS execution via dynamic amendment.
		// Can"t use "em `<script>`s already in the HTML!:

		document.body.insertAdjacentHTML("afterbegin", await html.text());
		css.href = `/theme/${g_theme}.css`; css.rel = "stylesheet"; document.body.appendChild(css);
		document.body.appendChild(document.createElement("script")).textContent = await javascript.text();

		correct();
		reveal();
	}

	document.addEventListener("DOMContentLoaded", () => {
