<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Form</title>
    <link rel="stylesheet" href="/ResumeBuilder/ResumeBuilder/css/resume-form.css">
</head>

<body>
    <h1>Resume Builder</h1>
    <p id="template-info"></p>

    <form id="resume-form">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="summary">Professional Summary:</label>
        <textarea id="summary" name="summary" rows="4" required></textarea>

        <button type="submit">Generate Resume</button>
    </form>

    <script src="resume_form.js"></script>
    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <h2>Resume Builder</h2>
                <p>Craft your perfect resume in minutes with our easy-to-use templates.</p>
            </div>

            <div class="footer-links">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>

            <div class="footer-links">
                <h3>Resources</h3>
                <ul>
                    <li><a href="#">Resume Tips</a></li>
                    <li><a href="#">Cover Letters</a></li>
                    <li><a href="#">Job Search Guide</a></li>
                    <li><a href="#">FAQs</a></li>
                </ul>
            </div>

            <div class="footer-social">
                <h3>Follow Us</h3>
                <div class="social-icons">
                    <a href="#"><img src="/ResumeBuilder/ResumeBuilder/assets/facebook.png" alt="Facebook"></a>
                    <a href="#"><img src="/ResumeBuilder/ResumeBuilder/assets/twitter.png" alt="Twitter"></a>
                    <a href="#"><img src="/ResumeBuilder/ResumeBuilder/assets/linkedin.png" alt="LinkedIn"></a>
                    <a href="#"><img src="/ResumeBuilder/ResumeBuilder/assets/insta.png" alt="Instagram"></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
        </div>
    </footer>

</html>
</body>

</html>
