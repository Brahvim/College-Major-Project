<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />
    <title>Resumé Builder - Choose Your Style</title>
</head>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background-color: #f9fbfd;
        color: #333;
    }

    .container {
        max-width: 960px;
        margin: 2rem auto;
        padding: 1rem;
    }

    .title {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 2rem;
    }

    .columns {
        display: flex;
        gap: 2rem;
        justify-content: space-between;
    }

    .column {
        flex: 1;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    button {
        border: none;
        padding: 1rem;
        border-radius: 1rem;
        /* SQUIRCLE-Y */
        cursor: pointer;
        background-color: #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        transition: all 0.2s ease;
        text-align: left;
    }

    button:hover {
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .layout-skeleton {
        background-color: #e0e0e0;
        border-radius: 0.5rem;
        height: 80px;
        margin-bottom: 0.5rem;
        position: relative;
        overflow: hidden;
    }

    /* Specific layout previews */
    .layout-skeleton.top-bottom::before {
        content: '';
        display: block;
        position: absolute;
        top: 25%;
        left: 10%;
        width: 80%;
        height: 50%;
        background-color: #cfd8dc;
        border-radius: 0.3rem;
    }

    .layout-skeleton.split::before {
        content: '';
        display: block;
        position: absolute;
        top: 10%;
        left: 10%;
        width: 20%;
        height: 25%;
        background-color: #cfd8dc;
        border-radius: 0.3rem;
    }

    .layout-skeleton.split::after {
        content: '';
        display: block;
        position: absolute;
        top: 40%;
        left: 10%;
        width: 30%;
        height: 40%;
        background-color: #cfd8dc;
        border-radius: 0.3rem;
    }

    .layout-skeleton.split .right {
        position: absolute;
        top: 10%;
        left: 45%;
        width: 45%;
        height: 80%;
        background-color: #b0bec5;
        border-radius: 0.3rem;
    }

    .layout-skeleton.tiles {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
        height: 80px;
    }

    .layout-skeleton.tiles::before,
    .layout-skeleton.tiles::after {
        content: '';
        display: block;
        height: 35px;
        background-color: #cfd8dc;
        border-radius: 0.3rem;
    }

    .layout-skeleton.card-sections::before {
        content: '';
        position: absolute;
        top: 10%;
        left: 10%;
        width: 80%;
        height: 20%;
        background-color: #b0bec5;
        border-radius: 0.3rem;
    }

    .layout-skeleton.card-sections::after {
        content: '';
        position: absolute;
        top: 40%;
        left: 10%;
        width: 80%;
        height: 50%;
        background-color: #cfd8dc;
        border-radius: 0.3rem;
    }
</style>

<body>
    <div class="container">
        <h1 class="title">Choose Your Layout & Theme</h1>
        <div class="columns">

            <!-- Layout Selection -->
            <div class="column">
                <h2>Layout</h2>
                <div class="options">
                    <button
                        class="layout-btn"
                        data-layout="top-bottom"
                    >
                        <div class="layout-skeleton top-bottom"></div>
                        <span>Top-Bottom</span>
                    </button>

                    <button
                        class="layout-btn"
                        data-layout="split"
                    >
                        <div class="layout-skeleton split"></div>
                        <span>20-30-50</span>
                    </button>

                    <button
                        class="layout-btn"
                        data-layout="tiles"
                    >
                        <div class="layout-skeleton tiles"></div>
                        <span>Tiles</span>
                    </button>

                    <button
                        class="layout-btn"
                        data-layout="card-sections"
                    >
                        <div class="layout-skeleton card-sections"></div>
                        <span>Card + Sections</span>
                    </button>
                </div>
            </div>

            <!-- Theme Selection -->
            <div class="column">
                <h2>Theme</h2>
                <div class="options">
                    <!-- Add your theme buttons here -->
                    <button
                        class="theme-btn"
                        data-theme="light-blue"
                    >Light Blue</button>
                    <button
                        class="theme-btn"
                        data-theme="white"
                    >Minimal White</button>
                    <!-- Add more as needed -->
                </div>
            </div>

        </div>
    </div>
</body>

</html>
